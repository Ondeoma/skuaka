# 開発用: PostgreSQL（ほかの開発環境とぶつからないよう、ポートを既定からずらしている）
name: skuaka
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: skuaka
      POSTGRES_PASSWORD: skuaka
      POSTGRES_DB: skuaka
    ports: ["54349:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/docker/dev-initdb.sql:/docker-entrypoint-initdb.d/10-skuaka-test.sql:ro   # テスト用DB skuaka_test
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "skuaka"]
      interval: 2s
      retries: 30
volumes:
  pgdata:
